name: Publish to PyPI
on:
  release:
    types: [published]

jobs:
  publish:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest
    permissions:
      # Required for PyPI trusted publishing (harmless if a token is used).
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history + tags so pdm's scm versioning resolves the tag.
          fetch-depth: 0
      - uses: pdm-project/setup-pdm@v4
        with:
          python-version: '3.12'
      - name: Build
        run: pdm build

      # ------------------------------------------------------------------
      # PyPI authentication is not decided yet. Enable exactly one option
      # below, then remove this note.
