name: Lint and run tests

on:
  pull_request:
    branches:
      - main

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [ '3.12' ]
    steps:
    - uses: actions/checkout@v4
      with:
        # resources/ test data lives in Git LFS, but it is fetched by the
        # cached steps below instead of here: a plain `lfs: true` would
        # re-download every file on every run and burn LFS bandwidth.
        lfs: false
    # Key the cache on the LFS object IDs, so it is reused until one of the
    # files under resources/ actually changes.
    - name: Resolve LFS object IDs
      run: git lfs ls-files -l | cut -d' ' -f1 | sort > .lfs-assets-id
    - name: Restore LFS cache
      uses: actions/cache@v4
      with:
        path: .git/lfs/objects
        key: lfs-${{ hashFiles('.lfs-assets-id') }}
    - name: Fetch LFS objects
      run: git lfs pull
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install -e .[dev]
    - name: Run linter checks
      run: ruff check . && ruff format --check .
    - name: Run tests and coverage
      run: pytest --cov=fiber_mosaic --cov-report=term --cov-fail-under=100
